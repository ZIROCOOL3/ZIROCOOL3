name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 6 * * *"   # se regenera todos los dias a las 06:00 UTC
  workflow_dispatch:        # tambien lo podes correr a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: zirocool3
          file: trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Commit and push trophy.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy.svg"
          file_pattern: trophy.svg
