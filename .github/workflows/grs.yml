name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # se regenera todos los dias a las 03:00 UTC
  workflow_dispatch:         # tambien se puede correr a mano desde Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=zirocool3&show_icons=true&locale=en
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=zirocool3&layout=compact&locale=en
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update readme stats cards"
          file_pattern: profile/*.svg
